<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Serving Team — Commissioned City Church</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Montserrat:wght@600;700;800&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/members.css">
  <link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body style="background:#f4f5f7;min-height:100vh;">

<main style="padding:32px 16px;display:flex;justify-content:center;">
  <div style="background:#fff;border-radius:12px;overflow:hidden;max-width:600px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,0.08);">

    <!-- Header bar -->
    <div style="background:var(--mp-accent,#112E53);padding:28px 40px;text-align:center;">
      <h1 style="margin:0;color:#fff;font-size:24px;font-weight:normal;letter-spacing:0.02em;font-family:Montserrat,sans-serif;">
        Commissioned City Church
      </h1>
    </div>

    <!-- Content -->
    <div id="swap-content" style="padding:32px 40px;">
      <div id="swap-loading" style="text-align:center;color:#888;padding:40px 0;">
        Loading contact list…
      </div>
    </div>

    <!-- Footer -->
    <div style="background:#f4f5f7;padding:20px 40px;border-top:1px solid #e6e9ee;text-align:center;">
      <p style="margin:0 0 4px;font-size:12px;color:#aaa;font-family:sans-serif;">Commissioned City Church</p>
      <p style="margin:0;font-size:12px;color:#bbb;font-family:sans-serif;">
        <a href="mailto:info@commissionedcity.church" style="color:#bbb;text-decoration:none;">info@commissionedcity.church</a>
      </p>
    </div>

  </div>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.SUPABASE_URL      = 'https://lkmphayrithxkmhvfiep.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_GO6ATIZLQftqjoBHTU8EKQ_5RR1397W';
</script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
  var content = document.getElementById('swap-content');

  function showError(msg) {
    content.innerHTML =
      '<div style="text-align:center;padding:32px 0;">' +
      '<p style="font-size:2em;margin-bottom:16px;">&#9888;</p>' +
      '<h2 style="color:#112E53;font-family:Montserrat,sans-serif;font-size:20px;margin-bottom:12px;">Link Expired</h2>' +
      '<p style="color:#666;font-size:15px;line-height:1.6;">' + msg + '</p>' +
      '<p style="margin-top:20px;font-size:13px;color:#aaa;">Questions? Contact us at ' +
      '<a href="mailto:info@commissionedcity.church" style="color:#112E53;">info@commissionedcity.church</a></p>' +
      '</div>';
  }

  // Read token from URL. The token travels in the fragment (#<token>) so the
  // '=' of a query param can't be mangled by email quoted-printable encoding
  // (a bare '=' followed by hex was being decoded as an escape, eating the
  // '=' and two token chars and breaking the link). Fall back to the legacy
  // ?token= param for any older links still within their 7-day window.
  var token = (window.location.hash || '').replace(/^#/, '').trim();
  if (!token) {
    var params = new URLSearchParams(window.location.search);
    token = params.get('token') || '';
  }
  if (!token) {
    showError('No token provided. This link may be malformed.');
    return;
  }

  // Wait for Supabase CDN
  await new Promise(r => setTimeout(r, 400));

  if (!window.supabase) {
    showError('Could not load page. Please try again.');
    return;
  }

  var url = window.SUPABASE_URL;
  var key = window.SUPABASE_ANON_KEY;
  if (!url || url === '{{ SUPABASE_URL }}') {
    showError('Configuration error. Please contact an administrator.');
    return;
  }

  var sb = window.supabase.createClient(url, key);

  // Fetch token record
  var { data: tokenRow, error: tokenErr } = await sb
    .from('swap_tokens')
    .select('*')
    .eq('token', token)
    .single();

  if (tokenErr || !tokenRow) {
    showError('This link could not be found. It may have already expired or been used.');
    return;
  }

  // Check expiry
  if (new Date(tokenRow.expires_at) < new Date()) {
    showError('This link has expired. Links are valid for 7 days. Please contact your team directly to arrange a swap.');
    return;
  }

  // Fetch the roster for this date
  var { data: roster, error: rosterErr } = await sb
    .from('schedule_rosters')
    .select('*')
    .eq('date', tokenRow.date)
    .single();

  // Format date
  var dateObj    = new Date(tokenRow.date + 'T12:00:00');
  var dateLabel  = dateObj.toLocaleDateString('en-CA', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  var eventTitle = roster ? (roster.title || 'Sunday Service') : 'Sunday Service';
  var slots      = (roster && roster.slots) ? roster.slots : [];

  // Build assignee name map from profile IDs in slots
  var profileIds = [];
  slots.forEach(function(slot) {
    if (slot.assignee_type === 'member'  && slot.assignee_id)   profileIds.push(slot.assignee_id);
    if (slot.assignee_type === 'couple'  && slot.assignee_id)   profileIds.push(slot.assignee_id);
    if (slot.assignee_type === 'couple'  && slot.assignee_id_b) profileIds.push(slot.assignee_id_b);
  });
  profileIds = [...new Set(profileIds)];

  var profileMap = {};
  if (profileIds.length) {
    var { data: profiles } = await sb
      .from('profiles')
      .select('id, first_name, last_name, full_name, email, phone1, phone1_type')
      .in('id', profileIds);
    (profiles || []).forEach(function(p) { profileMap[p.id] = p; });
  }

  // Fetch guest names
  var guestIds = slots.filter(s => s.assignee_type === 'guest' && s.guest_id).map(s => s.guest_id);
  var guestMap = {};
  if (guestIds.length) {
    var { data: guests } = await sb.from('guests').select('id, name, email').in('id', guestIds);
    (guests || []).forEach(function(g) { guestMap[g.id] = g; });
  }

  // Teams (id, name, instructions) — read live so checklist links always reflect
  // the current document, even edits made after the reminder was sent.
  var { data: allTeams } = await sb.from('teams').select('id, name, instructions');
  var teamById = {};   (allTeams || []).forEach(function(t){ teamById[t.id] = t; });
  var teamByName = {}; (allTeams || []).forEach(function(t){ teamByName[(t.name || '').toLowerCase()] = t; });

  // The recipient's team(s): prefer the team_ids carried by the token; fall back
  // to matching the token's role(s) to team names / roster slots (legacy tokens).
  var recipientTeamIds = String(tokenRow.team_ids || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  if (!recipientTeamIds.length) {
    var roleWords = String(tokenRow.role || '').toLowerCase().split(' & ').map(function(s){ return s.trim(); }).filter(Boolean);
    roleWords.forEach(function(rw){ if (teamByName[rw]) recipientTeamIds.push(teamByName[rw].id); });
    slots.forEach(function(s){
      if (s.team_id && teamById[s.team_id] && roleWords.indexOf(String(s.role || '').toLowerCase()) !== -1) recipientTeamIds.push(s.team_id);
    });
  }
  recipientTeamIds = recipientTeamIds.filter(function(id, i, a){ return teamById[id] && a.indexOf(id) === i; });

  // Every team that appears on this day's roster (for "other team" checklists).
  var dayTeamIds = [];
  slots.forEach(function(s){
    var tid = (s.team_id && teamById[s.team_id]) ? s.team_id
            : (s.role && teamByName[String(s.role).toLowerCase()] ? teamByName[String(s.role).toLowerCase()].id : '');
    if (tid && dayTeamIds.indexOf(tid) === -1) dayTeamIds.push(tid);
  });

  function teamHasInstructions(tid){ var t = teamById[tid]; return !!(t && t.instructions && String(t.instructions).trim()); }
  var myChecklistTeams    = recipientTeamIds.filter(teamHasInstructions).map(function(id){ return teamById[id]; });
  var otherChecklistTeams = dayTeamIds.filter(function(id){ return recipientTeamIds.indexOf(id) === -1 && teamHasInstructions(id); }).map(function(id){ return teamById[id]; });
  var swapTeams           = recipientTeamIds.map(function(id){ return teamById[id]; }).filter(Boolean);

  function getAssigneeName(slot) {
    var t = slot.assignee_type || '';
    if (t === 'member' && slot.assignee_id) {
      var p = profileMap[slot.assignee_id];
      if (!p) return '';
      return (p.first_name && p.last_name) ? (p.first_name + ' ' + p.last_name) : (p.full_name || '');
    }
    if (t === 'couple' && slot.assignee_id) {
      var a = profileMap[slot.assignee_id];
      var b = slot.assignee_id_b ? profileMap[slot.assignee_id_b] : null;
      var an = a ? ((a.first_name || a.full_name || '')) : '';
      var bn = b ? ((b.first_name || b.full_name || '')) : '';
      var al = a ? (a.last_name || '') : '';
      var bl = b ? (b.last_name || '') : '';
      if (al && bl && al.toLowerCase() === bl.toLowerCase()) return an + ' & ' + bn + ' ' + al;
      return (an + (al ? ' ' + al : '')) + ' & ' + (bn + (bl ? ' ' + bl : ''));
    }
    if (t === 'guest' && slot.guest_id) {
      var g = guestMap[slot.guest_id];
      return g ? g.name : '';
    }
    return '';
  }

  function getAssigneeContact(slot) {
    var t = slot.assignee_type || '';
    if (t === 'member' && slot.assignee_id) {
      var p = profileMap[slot.assignee_id];
      if (!p) return '';
      var parts = [];
      if (p.email) parts.push('<a href="mailto:'+esc(p.email)+'" style="color:#112E53;">'+esc(p.email)+'</a>');
      if (p.phone1) parts.push(esc((p.phone1_type || 'Cell') + ': ' + p.phone1));
      return parts.join('<br>');
    }
    if (t === 'couple' && slot.assignee_id) {
      var lines = [];
      [slot.assignee_id, slot.assignee_id_b].forEach(function(pid) {
        if (!pid) return;
        var p = profileMap[pid];
        if (!p) return;
        var name = p.first_name || (p.full_name || '').split(' ')[0] || p.email;
        var contact = p.email ? '<a href="mailto:'+esc(p.email)+'" style="color:#112E53;">'+esc(p.email)+'</a>' : '';
        if (p.phone1) contact += (contact ? ' &middot; ' : '') + esc((p.phone1_type||'Cell')+': '+p.phone1);
        if (contact) lines.push('<strong>'+esc(name)+':</strong> ' + contact);
      });
      return lines.join('<br>');
    }
    if (t === 'guest' && slot.guest_id) {
      var g = guestMap[slot.guest_id];
      return (g && g.email) ? '<a href="mailto:'+esc(g.email)+'" style="color:#112E53;">'+esc(g.email)+'</a>' : '';
    }
    return '';
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sectionTitle(label) {
    return '<h3 style="font-family:Montserrat,sans-serif;color:#112E53;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #eef1f6;">' + esc(label) + '</h3>';
  }
  var recipFirst = (tokenRow.person_name || '').trim().toLowerCase();

  // Build HTML
  var html = '';

  // ── Header ────────────────────────────────────────────────────────────────
  html += '<div style="text-align:center;margin-bottom:8px;">';
  html += '<h2 style="font-family:Montserrat,sans-serif;color:#112E53;font-size:20px;margin:0 0 6px;">Full Serving Team</h2>';
  html += '<p style="margin:0 0 10px;font-family:sans-serif;font-size:15px;color:#333;"><strong>' + esc(eventTitle) + '</strong> &mdash; ' + esc(dateLabel) + '</p>';
  html += '<p style="margin:0;font-family:sans-serif;font-size:14px;color:#444;line-height:1.6;">Hi <strong>' + esc(tokenRow.person_name) + '</strong>! Here\'s everyone serving on ' + esc(dateLabel) + ' — your checklist, the full team, and contact info if you need to arrange a swap.</p>';
  html += '</div>';

  // ── Section 1: who's serving (full roster, includes the recipient) ─────────
  html += sectionTitle('Who’s serving');
  var assignedSlots = slots.filter(function(s){ return getAssigneeName(s); });
  if (!assignedSlots.length) {
    html += '<p style="text-align:center;color:#888;font-family:sans-serif;line-height:1.6;">No one is on the roster for this date yet.</p>';
  } else {
    html += '<table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:14px;">';
    html += '<thead><tr>';
    html += '<th style="text-align:left;padding:10px 12px;background:#eef1f6;color:#112E53;font-weight:600;border-bottom:2px solid #dde3eb;">Role</th>';
    html += '<th style="text-align:left;padding:10px 12px;background:#eef1f6;color:#112E53;font-weight:600;border-bottom:2px solid #dde3eb;">Name</th>';
    html += '<th style="text-align:left;padding:10px 12px;background:#eef1f6;color:#112E53;font-weight:600;border-bottom:2px solid #dde3eb;">Contact</th>';
    html += '</tr></thead><tbody>';
    assignedSlots.forEach(function(slot, i) {
      var nm = getAssigneeName(slot);
      var isYou = recipFirst && (nm.split(' ')[0] || '').toLowerCase() === recipFirst;
      var bg = isYou ? '#fff7e6' : (i % 2 === 0 ? '#fff' : '#f7f9fc');
      html += '<tr style="background:' + bg + ';">';
      html += '<td style="padding:10px 12px;border-bottom:1px solid #eef1f6;color:#555;vertical-align:top;">' + esc(slot.role || '') + '</td>';
      html += '<td style="padding:10px 12px;border-bottom:1px solid #eef1f6;font-weight:600;color:#333;vertical-align:top;">' + esc(nm) + (isYou ? ' <span style="font-weight:600;color:#b8860b;font-size:0.8em;">(you)</span>' : '') + '</td>';
      html += '<td style="padding:10px 12px;border-bottom:1px solid #eef1f6;color:#555;vertical-align:top;">' + getAssigneeContact(slot) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  // ── Section 2: serving checklists ──────────────────────────────────────────
  if (myChecklistTeams.length || otherChecklistTeams.length) {
    html += sectionTitle('Serving checklists');
    if (myChecklistTeams.length) {
      html += '<p style="margin:0 0 10px;font-family:sans-serif;font-size:14px;color:#444;line-height:1.6;">Your checklist for this Sunday:</p>';
      html += '<div style="text-align:center;">';
      myChecklistTeams.forEach(function(t){
        html += '<a href="/members/instructions.html#' + esc(t.id) + '" style="display:inline-block;margin:4px;background:#D5393B;color:#fff;text-decoration:none;font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;padding:11px 22px;border-radius:6px;">' + esc(t.name) + ' Checklist &rarr;</a>';
      });
      html += '</div>';
    }
    if (otherChecklistTeams.length) {
      html += '<p style="margin:16px 0 8px;font-family:sans-serif;font-size:13px;color:#5C718E;line-height:1.6;">Other teams serving today:</p>';
      html += '<div style="text-align:center;">';
      otherChecklistTeams.forEach(function(t){
        html += '<a href="/members/instructions.html#' + esc(t.id) + '" style="display:inline-block;margin:3px;background:#eef1f6;color:#112E53;text-decoration:none;font-family:Montserrat,sans-serif;font-size:12px;font-weight:600;padding:8px 16px;border-radius:6px;">' + esc(t.name) + ' Checklist &rarr;</a>';
      });
      html += '</div>';
    }
  }

  // ── Section 3: need to swap? ────────────────────────────────────────────────
  if (swapTeams.length) {
    html += sectionTitle('Need to swap?');
    html += '<p style="margin:0 0 10px;font-family:sans-serif;font-size:14px;color:#444;line-height:1.6;">If you can’t serve as scheduled, reach out to someone on your team above to arrange a sub. You can also view your team’s full roster:</p>';
    html += '<div style="text-align:center;">';
    swapTeams.forEach(function(t) {
      html += '<a href="/members/dashboard.html?tab=teams#team-' + esc(t.id) + '" style="display:inline-block;margin:4px;background:#112E53;color:#fff;text-decoration:none;font-family:Montserrat,sans-serif;font-size:13px;font-weight:600;padding:10px 20px;border-radius:6px;">' + esc(t.name) + ' Team &rarr;</a>';
    });
    html += '</div>';
  }

  html += '<p style="margin-top:28px;font-size:12px;color:#aaa;text-align:center;font-family:sans-serif;">This link expires after 7 days. Questions? Email <a href="mailto:info@commissionedcity.church" style="color:#8a94a3;">info@commissionedcity.church</a>.</p>';

  content.innerHTML = html;
});
</script>

</body>
</html>
