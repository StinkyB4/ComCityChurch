<script>
function mpToggleSidebar() {
  var s = document.getElementById('mp-sidebar');
  var o = document.getElementById('mp-sidebar-overlay');
  if (!s) return;
  var open = s.classList.toggle('mp-sidebar--open');
  if (o) o.classList.toggle('mp-sidebar-overlay--visible', open);
  document.body.style.overflow = open ? 'hidden' : '';
}

function mpNavToggleGroup(key) {
  var sub = document.getElementById('mp-nav-sub-' + key);
  var grp = document.getElementById('mp-nav-group-' + key);
  if (!sub) return;
  var open = sub.classList.toggle('mp-nav-submenu--open');
  if (grp) grp.setAttribute('data-open', open ? '1' : '0');
}

function mpNavTo(tab, e) {
  if (e) e.preventDefault();
  var s = document.getElementById('mp-sidebar');
  var o = document.getElementById('mp-sidebar-overlay');
  if (s && s.classList.contains('mp-sidebar--open')) {
    s.classList.remove('mp-sidebar--open');
    if (o) o.classList.remove('mp-sidebar-overlay--visible');
    document.body.style.overflow = '';
  }
  if (window.mpDashboard && window.mpDashboard.navigate) {
    window.mpDashboard.navigate(tab);
  }
}
</script>
