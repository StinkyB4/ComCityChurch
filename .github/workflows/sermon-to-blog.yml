name: Sermon → Blog Draft

on:
  schedule:
    # Tuesday 12:00 UTC. Winnipeg is UTC-5 in summer / UTC-6 in winter, so this
    # lands at 7am CDT or 6am CST — after Monday evening's Drive upload either way.
    - cron: '0 12 * * 2'
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Google Drive file ID to process (blank = newest unprocessed recording)'
        required: false
        type: string
      status:
        description: 'Status to create the post with'
        required: false
        default: draft
        type: choice
        options: [draft, pending]

concurrency:
  group: sermon-to-blog
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/sermon-to-blog
        run: npm install --no-audit --no-fund

      - name: Draft the post
        working-directory: scripts/sermon-to-blog
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_SERMON_FOLDER_ID:     ${{ secrets.GDRIVE_SERMON_FOLDER_ID }}
          AZURE_SPEECH_KEY:            ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION:         ${{ secrets.AZURE_SPEECH_REGION }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:                ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLOG_AUTHOR_ID:              ${{ secrets.BLOG_AUTHOR_ID }}
          BLOG_AUTHOR_NAME:            ${{ secrets.BLOG_AUTHOR_NAME }}
          SERMON_FILE_ID:              ${{ inputs.file_id }}
          BLOG_POST_STATUS:            ${{ inputs.status || 'draft' }}
        run: node index.mjs

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sermon-transcript
          path: scripts/sermon-to-blog/transcript.txt
          if-no-files-found: ignore
          retention-days: 90
